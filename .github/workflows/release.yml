name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        type: string
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: forgesworn/anvil/.github/workflows/release.yml@ac7727cccb5d4ac7ad0aa71b1b775e6120a369b3 # v0.10.2
    with:
      tag: ${{ inputs.tag || '' }}
      test-command: npm run test:release
      strict-action-pins: true
      lifecycle-scripts-policy: strict
      reproducibility-mode: strict
